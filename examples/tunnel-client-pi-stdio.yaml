# tunnel-client profile for pi-as-mcp over stdio.
#
# Verified against `tunnel-client profiles samples show sample_mcp_stdio_local`
# (v0.0.11). The stdio server binds on channel "main"; tunnel-client spawns the
# command and speaks MCP over its stdin/stdout.
#
# Usage:
#   1. Copy to ~/.config/tunnel-client/pi-stdio.yaml  (or pass via --profile-file)
#   2. Export CONTROL_PLANE_API_KEY (a runtime key from Platform API-key settings)
#   3. Edit the tunnel_id and the command path below
#   4. tunnel-client doctor --profile pi-stdio --explain
#   5. tunnel-client run    --profile pi-stdio
#
# Docs: https://developers.openai.com/api/docs/guides/secure-mcp-tunnels
config_version: 1
control_plane:
  base_url: "https://api.openai.com"
  tunnel_id: "tunnel_REPLACE_ME_WITH_YOUR_TUNNEL_ID"
  api_key: "env:CONTROL_PLANE_API_KEY"
health:
  # Fixed port => stable admin UI at http://127.0.0.1:8080/ui.
  # Use "127.0.0.1:0" + url_file for concurrent/clean-room runs.
  listen_addr: "127.0.0.1:8080"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      # tunnel-client spawns this with ITS OWN cwd, so pass --cwd explicitly.
      # Use an absolute node path if PATH is minimal (e.g. under launchd/systemd).
      # Restrict to read-only by adding: --tools read
      command: "node /absolute/path/to/pi-as-mcp/dist/index.js --cwd /absolute/path/to/your/project"
