# OpenAI Secure MCP Tunnel profile for the repo-local pi-as-mcp server.
# Secrets and local working-directory settings live in tunnel/.env (gitignored)
# and are exported by scripts/tunnel.sh before tunnel-client starts:
#   CONTROL_PLANE_TUNNEL_ID -> control_plane.tunnel_id
#   CONTROL_PLANE_API_KEY   -> control_plane.api_key
#   PI_MCP_CWD              -> pi-as-mcp base working directory
#   PI_MCP_TOOLS            -> optional tool subset
#   PI_MCP_HERDR_SESSION    -> optional dedicated Herdr session for the agent tool
config_version: 1
control_plane:
  base_url: "https://api.openai.com"
health:
  listen_addr: "127.0.0.1:8080"
admin_ui:
  open_browser: false
log:
  level: info
  format: json
mcp:
  commands:
    - channel: main
      # scripts/tunnel.sh runs tunnel-client from the repository root, so this
      # path is stable. pi-as-mcp reads PI_MCP_CWD / PI_MCP_TOOLS from the env.
      command: "node ./dist/index.js"
